<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ifood Clone{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#EA1D2C;">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ url_for('contas.listar') }}">Ifood Clone</a>
      <div>
        <a href="{{ url_for('contas.listar') }}" class="btn btn-light btn-sm me-2">Contas</a>
        <a href="{{ url_for('restaurantes.listar') }}" class="btn btn-light btn-sm me-2">Restaurantes</a>
        <a href="{{ url_for('produtos.listar') }}" class="btn btn-light btn-sm me-2">Produtos</a>
        <a href="{{ url_for('auth_google.login') }}" class="btn btn-outline-light btn-sm">Entrar com Google</a>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
