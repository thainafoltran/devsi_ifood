{% extends "base.html" %}
{% block title %}{{ 'Editar conta' if conta and conta.id else 'Nova conta' }}{% endblock %}
{% block content %}
  <h2 class="mb-4">{{ 'Editar conta' if conta and conta.id else 'Nova conta' }}</h2>

  <form method="post" class="bg-white p-4 rounded shadow-sm" style="max-width:480px;">
    <div class="mb-3">
      <label class="form-label">Nome completo</label>
      <input type="text" name="nome" class="form-control"
             value="{{ conta.nome if conta else '' }}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">E-mail</label>
      <input type="email" name="email" class="form-control"
             value="{{ conta.email if conta else '' }}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Telefone</label>
      <input type="text" name="telefone" class="form-control"
             value="{{ conta.telefone if conta else '' }}">
    </div>

    <div class="mb-3">
      <label class="form-label">
        {{ 'Nova senha (deixe em branco para não alterar)' if conta and conta.id else 'Senha' }}
      </label>
      <input type="password" name="senha" class="form-control" minlength="6"
             {{ '' if conta and conta.id else 'required' }}>
    </div>

    {% if conta and conta.id %}
    <div class="form-check mb-3">
      <input type="checkbox" name="ativo" class="form-check-input" id="ativo"
             {{ 'checked' if conta.ativo else '' }}>
      <label class="form-check-label" for="ativo">Conta ativa</label>
    </div>
    {% endif %}

    <button type="submit" class="btn btn-danger">Salvar</button>
    <a href="{{ url_for('contas.listar') }}" class="btn btn-link">Cancelar</a>
  </form>
{% endblock %}
