{% extends "base2.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="card" style="max-width:460px;margin:auto">
<h2>Entrar</h2>
<form method="post">
  <input type="hidden" name="next" value="{{ next or '' }}">
  <label>Receber o código de 6 dígitos por</label>
  <div class="row">
    <label><input type="radio" name="canal" value="email" checked> E-mail</label>
    <label><input type="radio" name="canal" value="sms"> SMS</label>
    <label><input type="radio" name="canal" value="whatsapp"> WhatsApp</label>
  </div>
  <label for="ident">E-mail ou telefone (com DDD)</label>
  <input id="ident" name="identificador" required style="width:100%" placeholder="voce@email.com ou (11) 99999-9999">
  <p><button class="btn" type="submit">Continuar</button></p>
</form>
<hr>
<p class="mut">Ou entre/cadastre-se com:</p>
<div class="row">
  <a class="btn sec" href="{{ url_for('auth_google.login') }}">Google</a>
  <a class="btn sec" href="{{ url_for('contas.criar') }}">Criar conta com e-mail e senha</a>
</div>
</div>
{% endblock %}
