{% extends "base2.html" %}{% block titulo %}Verificar código{% endblock %}
{% block conteudo %}
<div class="card" style="max-width:460px;margin:auto;text-align:center">
<h2>Digite o código</h2>
<p class="mut">Enviamos 6 dígitos por {{ {'email':'e-mail','sms':'SMS','whatsapp':'WhatsApp'}[canal] }} para {{ destino }}. Vale por 5 minutos.</p>
<form method="post">
  <input class="codigo" name="codigo" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="one-time-code" autofocus required>
  <p><button class="btn" type="submit">Entrar</button></p>
</form>
<form method="post" action="{{ url_for('auth_codigo.reenviar') }}"><button class="btn sec sm">Reenviar código</button></form>
<p><a href="{{ url_for('auth_codigo.entrar') }}">Voltar</a></p>
</div>
{% endblock %}
